    function genToken() {
      const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let r = '';
      for (let i = 0; i < 6; i++) r += c[Math.floor(Math.random() * c.length)];
      return r;
    }

    function genPwd5() {
      const l = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const d = '23456789';
      const a = l + d;
      let p = l[Math.floor(Math.random() * l.length)] + d[Math.floor(Math.random() * d.length)];
      for (let i = 0; i < 3; i++) p += a[Math.floor(Math.random() * a.length)];
      return p.split('').sort(() => Math.random() - 0.5).join('');
    }

    function normalizeSupabaseUrlHtml(rawUrl) {
      let u = String(rawUrl || '').trim();
      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      try {
        const parsed = new URL(u);
        if (parsed.hostname === 'supabase.com' && parsed.pathname.includes('/project/')) {
          const m = parsed.pathname.match(/\/project\/([a-z0-9]+)/i);
          if (m && m[1]) return 'https://' + m[1] + '.supabase.co';
        }
        return parsed.origin;
      } catch {
        return u.replace(/\/+$/, '');
      }
    }

    function LucideIcon({ name, className = 'w-4 h-4' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide && window.lucide.icons && window.lucide.icons[name]) {
          const iconNode = window.lucide.createElement(window.lucide.icons[name]);
          iconNode.setAttribute('class', className);
          ref.current.innerHTML = '';
          ref.current.appendChild(iconNode);
        }
      }, [name, className]);
      return h('span', { ref, className: 'inline-flex items-center justify-center shrink-0' });
    }

    async function sbRest(url, anonKey, path, opts = {}) {
      const cleanUrl = normalizeSupabaseUrlHtml(url);
      const cleanKey = anonKey.trim();
      const headers = { apikey: cleanKey, Authorization: 'Bearer ' + cleanKey, 'Content-Type': 'application/json' };
      if (opts.prefer) headers['Prefer'] = opts.prefer;
      const res = await fetch(cleanUrl + '/rest/v1/' + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (!res.ok) {
        const txt = await res.text();
        let msg = 'HTTP ' + res.status;
        try { const j = JSON.parse(txt); msg = j.message || j.hint || j.details || msg; } catch { if (txt) msg = txt; }
        throw new Error(msg);
      }
      const t = await res.text();
      return t ? JSON.parse(t) : null;
    }

                  h('div', { className: 'px-3 py-1.5 rounded-xl bg-slate-900 text-white font-extrabold text-xs inline-block' }, 'Kelas ' + grp.className + ' — ' + grp.items.length + ' Kartu'),
                  h('div', { className: 'grid md:grid-cols-2 gap-4' },
                    grp.items.map((s) => h('div', { key: s.id, className: 'border-2 border-slate-800 rounded-2xl p-4 bg-white shadow-sm flex flex-col justify-between' },
                      h('div', null,
                        h('div', { className: 'border-b border-slate-300 pb-2 mb-3 text-center' }, h('div', { className: 'text-xs font-black uppercase tracking-wide text-slate-900' }, 'KARTU PESERTA UJIAN K-CBT'), h('div', { className: 'text-[11px] font-bold text-slate-600' }, 'SMP NEGERI 1 HAURWANGI')),
                        h('div', { className: 'space-y-1.5 text-xs' },
                          h('div', { className: 'flex' }, h('span', { className: 'w-24 font-bold text-slate-600' }, 'Nama'), h('span', { className: 'font-black text-slate-900' }, ': ' + s.name)),
                          h('div', { className: 'flex' }, h('span', { className: 'w-24 font-bold text-slate-600' }, 'Kelas'), h('span', { className: 'font-extrabold text-slate-900' }, ': ' + s.className)),
                          h('div', { className: 'flex' }, h('span', { className: 'w-24 font-bold text-slate-600' }, 'Username'), h('span', { className: 'font-mono font-extrabold text-slate-900' }, ': ' + s.nis)),
                          h('div', { className: 'flex items-center' }, h('span', { className: 'w-24 font-bold text-slate-600' }, 'Password'), h('span', { className: 'font-mono font-black text-sm px-2 py-0.5 rounded bg-slate-100 border border-slate-300 text-indigo-800' }, s.password))
                        )
                      ),
                      h('div', { className: 'mt-4 flex justify-end' }, h('div', { className: 'w-48 text-[11px] text-slate-800' }, h('div', null, 'Kepala Sekolah,'), h('div', { className: 'h-9' }), h('div', { className: 'font-extrabold underline' }, principalName), h('div', { className: 'text-[10px] text-slate-600' }, 'NIP. ' + principalNip)))
                    ))
                  )
                ))
              )
            )
          )
        )
      );
    }

    function OfflineKCBTApp() {
      const loadSaved = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY_HTML) || 'null'); } catch { return null; } };
      const loadSbCfg = () => {
        try { const c = JSON.parse(localStorage.getItem(SUPABASE_CFG_KEY) || 'null'); if (c && c.url && c.anonKey) return c; } catch {}
        return { url: DEFAULT_SUPABASE_URL, anonKey: DEFAULT_SUPABASE_ANON_KEY };
      };

      const saved = useMemo(() => loadSaved(), []);
      const [supabaseConfig, setSupabaseConfig] = useState(loadSbCfg);
      const [supabaseConnected, setSupabaseConnected] = useState(false);
      const [supabaseError, setSupabaseError] = useState('');

      const [students, setStudents] = useState(saved?.students?.length ? saved.students : (INITIAL_PAYLOAD.students || []));
      const [staffAccounts, setStaffAccounts] = useState(saved?.staffAccounts?.length ? saved.staffAccounts : (INITIAL_PAYLOAD.staffAccounts?.length ? INITIAL_PAYLOAD.staffAccounts : DEFAULT_STAFF_HTML));
      const [exams, setExams] = useState(saved?.exams?.length ? saved.exams : (INITIAL_PAYLOAD.exams || []));
      const [questions, setQuestions] = useState(saved?.questions?.length ? saved.questions : (INITIAL_PAYLOAD.questions || []));
      const [results, setResults] = useState(Array.isArray(saved?.results) ? saved.results : (INITIAL_PAYLOAD.results || []));
      const [savedSessions, setSavedSessions] = useState(saved?.savedSessions || {});
      const [examToken, setExamToken] = useState(saved?.examToken || INITIAL_PAYLOAD.examToken || genToken());
      const [tokenSecondsLeft, setTokenSecondsLeft] = useState(TOKEN_ROTATION_SECONDS);

      const [currentUser, setCurrentUser] = useState(null);
      const [activeExamSession, setActiveExamSession] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = useCallback((message, type = 'info') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); }, []);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_HTML, JSON.stringify({ students, staffAccounts, exams, questions, results, savedSessions, examToken })); } catch {}
      }, [students, staffAccounts, exams, questions, results, savedSessions, examToken]);

      const pullAllFromSupabase = useCallback(async (cfgOverride) => {
        const cfg = cfgOverride || supabaseConfig;
        if (!cfg || !cfg.url || !cfg.anonKey) { setSupabaseConnected(false); return; }
        try {
          setSupabaseError('');
          const [stuData, stfData, exData, qData, resData, sesData, tokData] = await Promise.all([
            sbRest(cfg.url, cfg.anonKey, 'students?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'staff_accounts?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'exams?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'questions?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'exam_results?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'saved_exam_sessions?select=*'),
            sbRest(cfg.url, cfg.anonKey, 'exam_settings?id=eq.1&select=*')
          ]);
          setSupabaseConnected(true);
          if (Array.isArray(stuData) && stuData.length > 0) setStudents(stuData.map(mapStudentFromDb));
          if (Array.isArray(stfData) && stfData.length > 0) setStaffAccounts(stfData);
          if (Array.isArray(exData) && exData.length > 0) setExams(exData.map(mapExamFromDb));
          if (Array.isArray(qData) && qData.length > 0) setQuestions(qData.map(mapQuestionFromDb));
          if (Array.isArray(resData) && resData.length > 0) {
            setResults(resData.map((r) => ({ id: r.id, studentId: r.student_id, nis: r.nis, studentName: r.student_name, className: r.class_name, subject: r.subject, score: r.score, needsEssayGrading: Boolean(r.needs_essay_grading), answers: r.answers || {}, essayScores: r.essay_scores || {}, submittedAt: r.submitted_at || '' })));
          }
          if (Array.isArray(sesData)) {
            const sesMap = {};
            sesData.forEach((row) => { sesMap[row.session_key] = { examId: row.exam_id, questions: row.questions || [], currentIndex: row.current_index || 0, answers: row.answers || {}, doubtful: row.doubtful || {}, secondsLeft: row.seconds_left || 3600 }; });
            setSavedSessions(sesMap);
          }
          if (Array.isArray(tokData) && tokData[0]?.exam_token) setExamToken(tokData[0].exam_token);
          showToast('Berhasil terhubung & sinkron dengan Supabase Cloud!', 'success');
        } catch (err) {
          setSupabaseConnected(false);
          const msg = err?.message || 'Gagal terhubung ke Supabase';
          setSupabaseError(msg);
          showToast('Gagal koneksi Supabase: ' + msg, 'error');
        }
      }, [supabaseConfig, showToast]);

      const pushAllToSupabase = useCallback(async () => {
        if (!supabaseConfig.url || !supabaseConfig.anonKey) return;
        try {
          if (students.length > 0) await sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'students?on_conflict=nis', { method: 'POST', prefer: 'resolution=merge-duplicates', body: students.map(mapStudentToDb) });
          if (staffAccounts.length > 0) await sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'staff_accounts?on_conflict=username', { method: 'POST', prefer: 'resolution=merge-duplicates', body: staffAccounts.map((a) => ({ name: a.name, username: a.username, role: a.role, password: a.password })) });
          if (exams.length > 0) await sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exams', { method: 'POST', body: exams.map(mapExamToDb) });
          if (questions.length > 0) await sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'questions', { method: 'POST', body: questions.map(mapQuestionToDb) });
          await sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exam_settings?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates', body: [{ id: 1, exam_token: examToken }] });
          showToast('Seluruh data lokal berhasil diunggah ke Supabase Cloud!', 'success');
          pullAllFromSupabase();
        } catch (err) {
          showToast('Gagal mengunggah ke Supabase: ' + (err?.message || 'Periksa tabel SQL & RLS'), 'error');
        }
      }, [supabaseConfig, students, staffAccounts, exams, questions, examToken, showToast, pullAllFromSupabase]);

      useEffect(() => {
        if (!supabaseConfig.url || !supabaseConfig.anonKey) { setSupabaseConnected(false); return; }
        pullAllFromSupabase(supabaseConfig);
        const poller = setInterval(() => { pullAllFromSupabase(supabaseConfig); }, 12000);
        return () => clearInterval(poller);
      }, [supabaseConfig, pullAllFromSupabase]);

      const setStudentsSynced = useCallback((updater) => {
        setStudents((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          if (supabaseConnected && supabaseConfig.url && supabaseConfig.anonKey) {
            sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'students?on_conflict=nis', { method: 'POST', prefer: 'resolution=merge-duplicates', body: next.map(mapStudentToDb) }).catch(() => {});
          }
          return next;
        });
      }, [supabaseConnected, supabaseConfig]);

      const setStaffSynced = useCallback((updater) => {
        setStaffAccounts((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          if (supabaseConnected && supabaseConfig.url && supabaseConfig.anonKey) {
            sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'staff_accounts?on_conflict=username', { method: 'POST', prefer: 'resolution=merge-duplicates', body: next.map((a) => ({ name: a.name, username: a.username, role: a.role, password: a.password })) }).catch(() => {});
          }
          return next;
        });
      }, [supabaseConnected, supabaseConfig]);

      useEffect(() => {
        const timer = setInterval(() => {
          setTokenSecondsLeft((prev) => {
            if (prev <= 1) {
              const nextTok = genToken();
              setExamToken(nextTok);
              if (supabaseConnected && supabaseConfig.url && supabaseConfig.anonKey) {
                sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exam_settings?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates', body: [{ id: 1, exam_token: nextTok }] }).catch(() => {});
              }
              return TOKEN_ROTATION_SECONDS;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [supabaseConnected, supabaseConfig]);

      const handleStudentLogin = ({ grade, nis, password, token }) => {
        const stu = students.find((s) => s.nis.trim().toLowerCase() === nis.trim().toLowerCase() && s.grade === grade);
        if (!stu) return 'NIS/NISN tidak terdaftar pada kategori Kelas ' + grade + '.';
        if (!stu.isAllowed) return 'AKUN DITAHAN: Akun Anda sedang ditahan oleh Proktor atau akibat pelanggaran tata tertib ujian.';
        if (!stu.isActive) return 'AKUN NONAKTIF: Akun peserta Anda sedang dinonaktifkan sementara oleh Proktor.';
        if (stu.password !== password.trim()) return 'Password siswa salah. Periksa kembali kartu login Anda.';
        if (token.trim().toUpperCase() !== examToken.toUpperCase()) return 'Token ujian salah atau sudah kedaluwarsa. Minta token terbaru kepada Pengawas/Proktor.';
        const ex = exams.find((x) => x.grade === stu.grade && x.isActive);
        if (!ex) return 'Tidak ada jadwal ujian yang sedang aktif untuk Kelas ' + stu.grade + '.';
        const prevSession = savedSessions[stu.id + '_' + ex.id];
        if (prevSession && Array.isArray(prevSession.questions) && prevSession.questions.length > 0) {
          setCurrentUser({ role: 'student', data: stu });
          setActiveExamSession({ exam: ex, questions: prevSession.questions, savedProgress: prevSession, startedAt: Date.now() });
          showToast('Melanjutkan ujian dari progres terakhir yang tersimpan.', 'info');
          return null;
        }
        let qList = questions.filter((q) => q.subject === ex.subject && q.grade === stu.grade);
        if (qList.length === 0) return 'Bank soal untuk mata pelajaran ' + ex.subject + ' (Kelas ' + stu.grade + ') masih kosong.';
        if (ex.shuffleQuestions) qList = [...qList].sort(() => Math.random() - 0.5);
        setCurrentUser({ role: 'student', data: stu });
        setActiveExamSession({ exam: ex, questions: qList, savedProgress: null, startedAt: Date.now() });
        return null;
      };

      const handleStaffLogin = ({ username, password }) => {
        const cleanUser = username.trim().toLowerCase();
        const activeStaffList = Array.isArray(staffAccounts) && staffAccounts.length > 0 ? staffAccounts : DEFAULT_STAFF_HTML;
        const staff = activeStaffList.find((a) => a.username.trim().toLowerCase() === cleanUser);
        if (!staff) return 'Username Guru / Proktor tidak ditemukan.';
        if (staff.password !== password.trim()) return 'Password Guru / Proktor salah.';
        setCurrentUser({ role: staff.role, data: staff });
        return null;
      };

      const handleForceTerminateCheating = useCallback((studentId, reasonLog, progressSnapshot) => {
        if (activeExamSession && progressSnapshot) {
          const sessionKey = studentId + '_' + activeExamSession.exam.id;
          const sesData = { examId: activeExamSession.exam.id, questions: activeExamSession.questions, currentIndex: progressSnapshot.currentIndex || 0, answers: progressSnapshot.answers || {}, doubtful: progressSnapshot.doubtful || {}, secondsLeft: progressSnapshot.secondsLeft || (activeExamSession.exam.durationMinutes * 60) };
          setSavedSessions((prev) => ({ ...prev, [sessionKey]: sesData }));
          if (supabaseConnected && supabaseConfig.url && supabaseConfig.anonKey) {
            sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'saved_exam_sessions?on_conflict=session_key', { method: 'POST', prefer: 'resolution=merge-duplicates', body: [{ session_key: sessionKey, student_id: studentId, exam_id: activeExamSession.exam.id, questions: sesData.questions, current_index: sesData.currentIndex, answers: sesData.answers, doubtful: sesData.doubtful, seconds_left: sesData.secondsLeft }] }).catch(() => {});
          }
        }
        setStudentsSynced((prev) => prev.map((s) => s.id === studentId ? { ...s, isActive: false, isAllowed: false, violations: 3, lastViolationReason: reasonLog } : s));
        setActiveExamSession(null);
        setCurrentUser(null);
        showToast('UJIAN DIHENTIKAN (3x Pelanggaran)! Progres disimpan sementara & akun ditahan ke Proktor.', 'error');
      }, [activeExamSession, supabaseConnected, supabaseConfig, setStudentsSynced, showToast]);

      const handleSubmitExamAnswers = useCallback((student, exam, examQuestions, answers) => {
        let maxW = 0, gotW = 0, hasEssay = false;
        examQuestions.forEach((q) => {
          const w = Number(q.weight || 10); maxW += w; const ans = answers[q.id];
          if (q.type === 'URAIAN') hasEssay = true;
          else if (q.type === 'PG' && ans === q.correctOption) gotW += w;
          else if (q.type === 'PGK') { const cArr = [...(q.correctOptions || [])].sort(); const uArr = Array.isArray(ans) ? [...ans].sort() : []; if (cArr.length && cArr.length === uArr.length && cArr.every((v, i) => v === uArr[i])) gotW += w; }
          else if (q.type === 'BS') { const stmts = q.statements || []; if (stmts.length && ans && typeof ans === 'object') { let cc = 0; stmts.forEach((st, i) => { if (ans[i] === st.answer) cc++; }); gotW += (cc / stmts.length) * w; } }
          else if (q.type === 'ISIAN') { if (String(ans || '').trim().toLowerCase() === String(q.correctShortAnswer || '').trim().toLowerCase()) gotW += w; }
        });
        const finalScore = maxW > 0 ? Math.round((gotW / maxW) * 100) : 0;
        const newResult = { id: 'res-' + Date.now(), studentId: student.id, nis: student.nis, studentName: student.name, className: student.className, subject: exam.subject, score: finalScore, needsEssayGrading: hasEssay, answers, essayScores: {}, submittedAt: new Date().toLocaleString('id-ID') };
        setResults((prev) => [newResult, ...prev]);
        setSavedSessions((prev) => { const c = { ...prev }; delete c[student.id + '_' + exam.id]; return c; });
        if (supabaseConnected && supabaseConfig.url && supabaseConfig.anonKey) {
          sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exam_results', { method: 'POST', body: [{ student_id: student.id, nis: student.nis, student_name: student.name, class_name: student.className, subject: exam.subject, score: finalScore, needs_essay_grading: hasEssay, answers, essay_scores: {}, submitted_at: newResult.submittedAt }] }).catch(() => {});
          sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'saved_exam_sessions?session_key=eq.' + encodeURIComponent(student.id + '_' + exam.id), { method: 'DELETE' }).catch(() => {});
        }
        setActiveExamSession(null);
        setCurrentUser(null);
        showToast('Ujian selesai! Jawaban Anda berhasil dikirim.', 'success');
      }, [supabaseConnected, supabaseConfig, showToast]);

      return h('div', { className: 'min-h-screen bg-slate-100 text-slate-900 antialiased' },
        toast && h('div', { className: 'fixed bottom-5 right-5 z-50 max-w-sm' },
          h('div', { className: 'px-4 py-3 rounded-2xl shadow-xl border text-xs font-extrabold flex items-center gap-2.5 ' + (toast.type === 'error' ? 'bg-rose-600 border-rose-700 text-white' : toast.type === 'success' ? 'bg-emerald-600 border-emerald-700 text-white' : 'bg-slate-900 border-slate-800 text-white') }, h(LucideIcon, { name: 'Sparkles', className: 'w-4 h-4 text-amber-300' }), h('span', null, toast.message))
        ),
        !currentUser
          ? h(LandingLoginPortalHtml, { onStudentLogin: handleStudentLogin, onStaffLogin: handleStaffLogin, supabaseConnected, onRestoreDefaultStaff: () => { setStaffSynced(DEFAULT_STAFF_HTML); showToast('Akun staf default (admin / guru1 / proktor1, pass: 123) berhasil dipulihkan!', 'success'); } })
          : currentUser.role === 'student' && activeExamSession
          ? h(StudentExamInterfaceHtml, { student: currentUser.data, session: activeExamSession, onSubmitExam: handleSubmitExamAnswers, onForceTerminateCheating: handleForceTerminateCheating })
          : h(StaffDashboardHtml, {
              user: currentUser.data, onLogout: () => setCurrentUser(null),
              students, setStudents: setStudentsSynced, staffAccounts, setStaffAccounts: setStaffSynced,
              exams, setExams, questions, setQuestions, results, setResults,
              examToken, tokenSecondsLeft, supabaseConfig, supabaseConnected, supabaseError,
              onSaveSupabaseConfig: (cfg) => { localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg)); setSupabaseConfig(cfg); if (!cfg.url || !cfg.anonKey) { setSupabaseConnected(false); setSupabaseError(''); showToast('Koneksi Supabase diputus.', 'info'); } },
              onPushAllToSupabase: pushAllToSupabase, onPullAllFromSupabase: () => pullAllFromSupabase(),
              onRotateToken: () => { const next = genToken(); setExamToken(next); setTokenSecondsLeft(TOKEN_ROTATION_SECONDS); if (supabaseConnected && supabaseConfig.url) sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exam_settings?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates', body: [{ id: 1, exam_token: next }] }).catch(() => {}); showToast('Token ujian baru (' + next + ') aktif selama 10 menit.', 'success'); },
              onSaveManualToken: (custom) => { const clean = custom.trim().toUpperCase(); if (clean.length < 4) return showToast('Token minimal 4 karakter.', 'error'); setExamToken(clean); setTokenSecondsLeft(TOKEN_ROTATION_SECONDS); if (supabaseConnected && supabaseConfig.url) sbRest(supabaseConfig.url, supabaseConfig.anonKey, 'exam_settings?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates', body: [{ id: 1, exam_token: clean }] }).catch(() => {}); showToast('Token manual (' + clean + ') disimpan.', 'success'); },
              showToast
            })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(OfflineKCBTApp));
  </script>
</body>
</html>
